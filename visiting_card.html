<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visiting Card</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #450737;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #b588ad;
      width: 350px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      text-align: center;
    }
    .card h2 {
      margin: 10px 0;
      color: #332e2e;
    }
    .card p {
      margin: 5px 0;
      color: #252020;
    }
    .card .contact {
      margin-top: 15px;
      font-size: 14px;
      color: #777;
    }
    .button{
        color: rgb(104, 63, 70);
    }
  </style>
</head>
<body>
    <div class="card">
    <img src="DSC00812.JPG" height=100px>
    <h2>Raavee</h2>
    <p>Software Developer</p>
    <p>Specializing in Python & C++</p>
    <div class="contact">
      <p>Email: raavee@xyz.com</p>
      <p>Phone: +91 99999 99999</p>
      <p>Location: Mysore, India</p>
      <button class="button">CONTACT</button>
    </div>
  </div>
</body>
</html>
